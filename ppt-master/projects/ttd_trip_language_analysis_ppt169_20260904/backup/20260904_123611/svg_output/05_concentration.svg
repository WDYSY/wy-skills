<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <!-- Background -->
  <rect width="1280" height="720" fill="#FFFFFF"/>
  
  <!-- Top accent bar -->
  <rect x="0" y="0" width="1280" height="4" fill="#1B3A5C"/>
  
  <!-- Kicker -->
  <text x="60" y="60" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="18" font-weight="500" fill="#E46C2C">集中度分析</text>
  
  <!-- Title -->
  <text x="60" y="110" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="42" font-weight="700" fill="#1B3A5C">TOP 2 占 59%：流量高度集中</text>
  
  <!-- Hairline divider -->
  <line x1="60" y1="135" x2="1220" y2="135" stroke="#1B3A5C" stroke-width="2"/>
  
  <!-- Donut chart -->
  <!-- Center: 380, 390, Outer r: 170, Inner r: 110 -->
  <!-- Segments: zh-hk 30.1%, en-sg 29.0%, zh-tw 7.4%, en-my 7.3%, Others 26.2% -->
  
  <!-- Segment 1: zh-hk 30.1% - Accent (#E46C2C) -->
  <!-- From -90° clockwise 108.4° -->
  <path d="M 380,390 L 380,220 A 170,170 0 0,1 521.4,282.6 L 474.9,307.1 A 110,110 0 0,0 380,280 Z" fill="#E46C2C"/>
  
  <!-- Segment 2: en-sg 29.0% - Primary (#1B3A5C) -->
  <!-- From 18.4° to 122.8° -->
  <path d="M 521.4,282.6 A 170,170 0 0,1 568.0,472.7 L 501.6,443.5 A 110,110 0 0,0 474.9,307.1 Z" fill="#1B3A5C"/>
  
  <!-- Segment 3: zh-tw 7.4% - Secondary accent (#4A90A4) -->
  <!-- From 122.8° to 149.4° -->
  <path d="M 568.0,472.7 A 170,170 0 0,1 530.5,533.5 L 477.4,482.8 A 110,110 0 0,0 501.6,443.5 Z" fill="#4A90A4"/>
  
  <!-- Segment 4: en-my 7.3% - Border gray -->
  <!-- From 149.4° to 175.7° -->
  <path d="M 530.5,533.5 A 170,170 0 0,1 523.6,551.4 L 472.9,494.4 A 110,110 0 0,0 477.4,482.8 Z" fill="#8A94A6"/>
  
  <!-- Segment 5: Others 26.2% - Light gray -->
  <!-- From 175.7° clockwise to 270° (-90°) -->
  <path d="M 523.6,551.4 A 170,170 0 0,1 380,220 L 380,280 A 110,110 0 0,0 472.9,494.4 Z" fill="#DCE2EA"/>
  
  <!-- Center circle -->
  <circle cx="380" cy="390" r="110" fill="#FFFFFF"/>
  
  <!-- Center text -->
  <text x="380" y="375" font-family="Georgia, Microsoft YaHei, PingFang SC, serif" font-size="40" font-weight="700" fill="#1B3A5C" text-anchor="middle">59%</text>
  <text x="380" y="410" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="18" fill="#5C6675" text-anchor="middle">TOP 2 合计</text>
  
  <!-- Legend -->
  <!-- Right side legend -->
  <g transform="translate(620, 170)">
    <rect x="0" y="0" width="16" height="16" fill="#E46C2C"/>
    <text x="26" y="14" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="20" fill="#1D2430">zh-hk 香港 · 30.1%</text>
    <text x="280" y="14" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="16" fill="#5C6675">603,658 PV</text>
    
    <rect x="0" y="35" width="16" height="16" fill="#1B3A5C"/>
    <text x="26" y="49" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="20" fill="#1D2430">en-sg 新加坡 · 29.0%</text>
    <text x="280" y="49" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="16" fill="#5C6675">581,867 PV</text>
    
    <rect x="0" y="70" width="16" height="16" fill="#4A90A4"/>
    <text x="26" y="84" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="20" fill="#1D2430">zh-tw 台湾 · 7.4%</text>
    <text x="280" y="84" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="16" fill="#5C6675">148,331 PV</text>
    
    <rect x="0" y="105" width="16" height="16" fill="#8A94A6"/>
    <text x="26" y="119" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="20" fill="#1D2430">en-my 马来 · 7.3%</text>
    <text x="280" y="119" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="16" fill="#5C6675">146,071 PV</text>
    
    <rect x="0" y="140" width="16" height="16" fill="#DCE2EA"/>
    <text x="26" y="154" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="20" fill="#1D2430">其他 46+ 站 · 26.2%</text>
    <text x="280" y="154" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="16" fill="#5C6675">~524,414 PV</text>
  </g>
  
  <!-- Key insight -->
  <rect x="620" y="420" width="580" height="100" fill="#F5F7FA" rx="4"/>
  <line x1="620" y1="420" x2="620" y2="520" stroke="#E46C2C" stroke-width="3"/>
  <text x="650" y="458" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="20" font-weight="700" fill="#1D2430">主力客源区域</text>
  <text x="650" y="492" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="18" fill="#5C6675">港澳台 + 东南亚（新马）+ 俄韩</text>
  
  <!-- Footer -->
  <text x="60" y="660" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="14" fill="#8A94A6">全量共 50+ 个语言站，长尾站点共享约 11% 流量</text>
  <text x="1220" y="660" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="14" fill="#8A94A6" text-anchor="end">05</text>
</svg>
