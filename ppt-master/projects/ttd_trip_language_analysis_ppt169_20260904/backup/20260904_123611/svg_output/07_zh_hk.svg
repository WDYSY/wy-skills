<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <!-- Background -->
  <rect width="1280" height="720" fill="#FFFFFF"/>
  
  <!-- Top accent bar -->
  <rect x="0" y="0" width="1280" height="4" fill="#E46C2C"/>
  
  <!-- Kicker -->
  <text x="60" y="60" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="18" font-weight="500" fill="#E46C2C">重点站点分析 · 01</text>
  
  <!-- Title -->
  <text x="60" y="110" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="42" font-weight="700" fill="#1B3A5C">zh-hk 香港繁体 — 站内流量主导</text>
  
  <!-- Hairline divider -->
  <line x1="60" y1="135" x2="1220" y2="135" stroke="#1B3A5C" stroke-width="2"/>
  
  <!-- Hero number -->
  <text x="60" y="260" font-family="Georgia, Microsoft YaHei, PingFang SC, serif" font-size="72" font-weight="700" fill="#E46C2C">66.6%</text>
  <text x="300" y="260" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="24" fill="#5C6675">站内流量占比 · 全站最高</text>
  
  <text x="60" y="300" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="24" fill="#1D2430">香港用户在平台内自发流转，对外投放依赖低</text>
  
  <!-- Secondary numbers -->
  <text x="60" y="360" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="16" fill="#8A94A6">PV 603,658（第 1 名）</text>
  <text x="60" y="390" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="16" fill="#8A94A6">UV 49,043（第 1 名）</text>
  <text x="60" y="420" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="16" fill="#8A94A6">PV 占比 30.1%</text>
  
  <!-- Channel breakdown -->
  <rect x="540" y="170" width="660" height="420" fill="#F5F7FA" rx="4"/>
  <text x="580" y="215" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="24" font-weight="700" fill="#1B3A5C">渠道构成</text>
  
  <!-- 站内 66.6% -->
  <text x="580" y="265" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="18" fill="#1D2430">站内</text>
  <rect x="680" y="252" width="460" height="22" fill="#DCE2EA"/>
  <rect x="680" y="252" width="306" height="22" fill="#1B3A5C"/>
  <text x="1150" y="269" font-family="Georgia, Microsoft YaHei, PingFang SC, serif" font-size="18" font-weight="700" fill="#1B3A5C">66.6%</text>
  
  <!-- Partner 13.3% -->
  <text x="580" y="315" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="18" fill="#1D2430">Partner</text>
  <rect x="680" y="302" width="460" height="22" fill="#DCE2EA"/>
  <rect x="680" y="302" width="61" height="22" fill="#4A90A4"/>
  <text x="1150" y="319" font-family="Georgia, Microsoft YaHei, PingFang SC, serif" font-size="18" font-weight="700" fill="#4A90A4">13.3%</text>
  
  <!-- APP-PUSH 5.4% -->
  <text x="580" y="365" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="18" fill="#1D2430">APP-PUSH</text>
  <rect x="680" y="352" width="460" height="22" fill="#DCE2EA"/>
  <rect x="680" y="352" width="25" height="22" fill="#E46C2C"/>
  <text x="1150" y="369" font-family="Georgia, Microsoft YaHei, PingFang SC, serif" font-size="18" font-weight="700" fill="#E46C2C">5.4%</text>
  
  <!-- SEO 4.5% -->
  <text x="580" y="415" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="18" fill="#1D2430">SEO</text>
  <rect x="680" y="402" width="460" height="22" fill="#DCE2EA"/>
  <rect x="680" y="402" width="21" height="22" fill="#2E9E6B"/>
  <text x="1150" y="419" font-family="Georgia, Microsoft YaHei, PingFang SC, serif" font-size="18" font-weight="700" fill="#2E9E6B">4.5%</text>
  
  <!-- PPC 5.0% -->
  <text x="580" y="465" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="18" fill="#1D2430">PPC</text>
  <rect x="680" y="452" width="460" height="22" fill="#DCE2EA"/>
  <rect x="680" y="452" width="23" height="22" fill="#D64545"/>
  <text x="1150" y="469" font-family="Georgia, Microsoft YaHei, PingFang SC, serif" font-size="18" font-weight="700" fill="#D64545">5.0%</text>
  
  <!-- Strategy callout -->
  <rect x="60" y="480" width="440" height="110" fill="#F5F7FA" rx="4"/>
  <line x1="60" y1="480" x2="60" y2="590" stroke="#E46C2C" stroke-width="3"/>
  <text x="88" y="515" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="22" font-weight="700" fill="#1B3A5C">运营策略</text>
  <text x="88" y="550" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="18" fill="#1D2430">加强平台内交叉引流</text>
  <text x="88" y="578" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="18" fill="#1D2430">Partner 联盟是第二抓手</text>
  
  <!-- Footer -->
  <text x="60" y="660" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="14" fill="#8A94A6">数据来源：dw_ticketdb.edw_log_ttd_traffic_order_d_ext</text>
  <text x="1220" y="660" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="14" fill="#8A94A6" text-anchor="end">07</text>
</svg>
