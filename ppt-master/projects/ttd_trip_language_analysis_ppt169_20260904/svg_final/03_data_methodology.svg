<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  
  <rect width="1280" height="720" fill="#FFFFFF" />
  
  
  <rect x="0" y="0" width="1280" height="4" fill="#1B3A5C" />
  
  
  <text x="60" y="60" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="18" font-weight="500" fill="#E46C2C">数据口径</text>
  
  
  <text x="60" y="110" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="42" font-weight="700" fill="#1B3A5C">按语言站（locale）口径统计</text>
  
  
  <line x1="60" y1="135" x2="1220" y2="135" stroke="#1B3A5C" stroke-width="2" />
  
  
  
  <path fill="#F5F7FA" d="M64,170 H616 A4,4 0 0 1 620,174 V396 A4,4 0 0 1 616,400 H64 A4,4 0 0 1 60,396 V174 A4,4 0 0 1 64,170 Z" />
  <rect x="60" y="170" width="4" height="230" fill="#1B3A5C" />
  <text x="88" y="215" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="26" font-weight="700" fill="#1B3A5C">数据环境</text>
  <text x="88" y="258" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="20" fill="#1D2430">SGP 集群（T 站海外数据）</text>
  <text x="88" y="292" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="20" fill="#1D2430">数据表：dw_ticketdb.edw_log_ttd_traffic_order_d_ext</text>
  <text x="88" y="326" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="20" fill="#1D2430">过滤：page_ct='trip' + sub_bu_name='ibu门票'</text>
  <text x="88" y="360" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="18" fill="#5C6675">数据周期：2026-08-10 ～ 08-17（完整 7 天）</text>
  
  
  <path fill="#F5F7FA" d="M664,170 H1216 A4,4 0 0 1 1220,174 V396 A4,4 0 0 1 1216,400 H664 A4,4 0 0 1 660,396 V174 A4,4 0 0 1 664,170 Z" />
  <rect x="660" y="170" width="4" height="230" fill="#E46C2C" />
  <text x="688" y="215" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="26" font-weight="700" fill="#1B3A5C">统计口径</text>
  <text x="688" y="258" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="20" fill="#1D2430">站点：按 locale 字段（语言站）</text>
  <text x="688" y="292" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="20" fill="#1D2430">PV = count(distinct com_pv)</text>
  <text x="688" y="326" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="20" fill="#1D2430">UV = count(distinct vid)</text>
  <text x="688" y="360" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="18" fill="#5C6675">流量来源：trip_channel</text>
  
  
  <line x1="60" y1="440" x2="1220" y2="440" stroke="#DCE2EA" stroke-width="1" />
  <text x="60" y="485" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="24" fill="#5C6675">⚠ 说明：上一轮按景点（viewspotname）统计回偏，本轮已修正为按语言站口径重新统计</text>
  
  
  <path fill="#F5F7FA" d="M64,520 H416 A4,4 0 0 1 420,524 V576 A4,4 0 0 1 416,580 H64 A4,4 0 0 1 60,576 V524 A4,4 0 0 1 64,520 Z" />
  <text x="80" y="558" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="18" fill="#1D2430">zh-hk = 香港繁体</text>
  
  <path fill="#F5F7FA" d="M464,520 H816 A4,4 0 0 1 820,524 V576 A4,4 0 0 1 816,580 H464 A4,4 0 0 1 460,576 V524 A4,4 0 0 1 464,520 Z" />
  <text x="480" y="558" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="18" fill="#1D2430">en-sg = 新加坡英文</text>
  
  <path fill="#F5F7FA" d="M864,520 H1216 A4,4 0 0 1 1220,524 V576 A4,4 0 0 1 1216,580 H864 A4,4 0 0 1 860,576 V524 A4,4 0 0 1 864,520 Z" />
  <text x="880" y="558" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="18" fill="#1D2430">zh-tw = 台湾繁体</text>
  
  
  <text x="60" y="660" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="14" fill="#8A94A6">全量共 50+ 个语言站</text>
  <text x="1220" y="660" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="14" fill="#8A94A6" text-anchor="end">03</text>
</svg>