      <tspan x="88" dy="44">SGP 集群 · locale 口径</tspan>
    </text>
  </g>

  <g id="cover-stats">
    <line x1="88" y1="520" x2="560" y2="520" stroke="#1E3350" stroke-width="1"/>
    <text x="88" y="560" font-family="'Microsoft YaHei', 'PingFang SC', Arial, sans-serif" font-size="48" font-weight="bold" fill="#F5A623">50+</text>
    <text x="88" y="592" font-family="'Microsoft YaHei', 'PingFang SC', Arial, sans-serif" font-size="16" fill="#9FB3CC">语言站</text>
    <text x="248" y="560" font-family="'Microsoft YaHei', 'PingFang SC', Arial, sans-serif" font-size="48" font-weight="bold" fill="#F5A623">59%</text>
    <text x="248" y="592" font-family="'Microsoft YaHei', 'PingFang SC', Arial, sans-serif" font-size="16" fill="#9FB3CC">TOP2 集中度</text>
    <text x="408" y="560" font-family="'Microsoft YaHei', 'PingFang SC', Arial, sans-serif" font-size="48" font-weight="bold" fill="#F5A623">88.6%</text>
    <text x="408" y="592" font-family="'Microsoft YaHei', 'PingFang SC', Arial, sans-serif" font-size="16" fill="#9FB3CC">TOP10 覆盖</text>
