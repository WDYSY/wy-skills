  <text x="688" y="268" font-family="'Microsoft YaHei', 'PingFang SC', Arial, sans-serif" font-size="20" fill="#E8F0FA">站点：按 locale 字段（语言站）</text>
  <text x="688" y="302" font-family="'Microsoft YaHei', 'PingFang SC', Arial, sans-serif" font-size="18" fill="#8FA8C8">PV = count(distinct com_pv)</text>
  <text x="688" y="336" font-family="'Microsoft YaHei', 'PingFang SC', Arial, sans-serif" font-size="18" fill="#8FA8C8">UV = count(distinct vid)</text>
  <text x="688" y="380" font-family="'Microsoft YaHei', 'PingFang SC', Arial, sans-serif" font-size="16" fill="#5C7590">流量来源：trip_channel</text>

  
  <path fill="#FF6B6B" fill-opacity="0.08" stroke="#FF6B6B" stroke-width="1" stroke-opacity="0.3" d="M72,450 H1208 A12,12 0 0 1 1220,462 V498 A12,12 0 0 1 1208,510 H72 A12,12 0 0 1 60,498 V462 A12,12 0 0 1 72,450 Z" />
