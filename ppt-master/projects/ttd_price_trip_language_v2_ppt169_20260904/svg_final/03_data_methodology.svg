  <path fill="#1A2D4A" fill-opacity="0.6" stroke="#4FC3F7" stroke-width="1" stroke-opacity="0.3" d="M802,540 H1123 A12,12 0 0 1 1135,552 V588 A12,12 0 0 1 1123,600 H802 A12,12 0 0 1 790,588 V552 A12,12 0 0 1 802,540 Z" />
