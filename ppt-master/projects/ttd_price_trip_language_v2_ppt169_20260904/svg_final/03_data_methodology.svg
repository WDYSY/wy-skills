  <rect x="60" y="145" width="1160" height="2" fill="#4FC3F7" fill-opacity="0.4" />

  
  <path fill="#4FC3F7" fill-opacity="0.08" stroke="#4FC3F7" stroke-width="1" stroke-opacity="0.35" d="M76,180 H604 A16,16 0 0 1 620,196 V404 A16,16 0 0 1 604,420 H76 A16,16 0 0 1 60,404 V196 A16,16 0 0 1 76,180 Z" />
  <text x="88" y="228" font-family="'Microsoft YaHei', 'PingFang SC', Arial, sans-serif" font-size="26" font-weight="700" fill="#4FC3F7">数据环境</text>
  <text x="88" y="268" font-family="'Microsoft YaHei', 'PingFang SC', Arial, sans-serif" font-size="20" fill="#E8F0FA">SGP 集群（T 站海外数据）</text>
  <text x="88" y="302" font-family="'Microsoft YaHei', 'PingFang SC', Arial, sans-serif" font-size="18" fill="#8FA8C8">dw_ticketdb.edw_log_ttd_traffic_order_d_ext</text>
  <text x="88" y="336" font-family="'Microsoft YaHei', 'PingFang SC', Arial, sans-serif" font-size="18" fill="#8FA8C8">过滤：page_ct='trip' + sub_bu_name='ibu门票'</text>
  <text x="88" y="380" font-family="'Microsoft YaHei', 'PingFang SC', Arial, sans-serif" font-size="16" fill="#5C7590">数据周期：2026-08-10 ～ 08-17（完整 7 天）</text>

  
  <path fill="#FFB74D" fill-opacity="0.05" stroke="#FFB74D" stroke-width="1" stroke-opacity="0.25" d="M676,180 H1204 A16,16 0 0 1 1220,196 V404 A16,16 0 0 1 1204,420 H676 A16,16 0 0 1 660,404 V196 A16,16 0 0 1 676,180 Z" />
