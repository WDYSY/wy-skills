<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <rect width="1280" height="720" fill="#0F1B2D"/>
  <circle cx="1100" cy="600" r="200" fill="#4FC3F7" fill-opacity="0.05"/>
  <circle cx="150" cy="100" r="150" fill="#FFB74D" fill-opacity="0.04"/>

  <text x="60" y="70" font-family="'Microsoft YaHei', 'PingFang SC', Arial, sans-serif" font-size="18" font-weight="500" fill="#4FC3F7">数据口径</text>
  <text x="60" y="125" font-family="'Microsoft YaHei', 'PingFang SC', Arial, sans-serif" font-size="42" font-weight="700" fill="#E8F0FA">按语言站（locale）口径统计</text>
  <rect x="60" y="145" width="1160" height="2" fill="#4FC3F7" fill-opacity="0.4"/>

  <!-- Left glass card: 数据环境 -->
  <rect x="60" y="180" width="560" height="240" rx="16" fill="#4FC3F7" fill-opacity="0.08" stroke="#4FC3F7" stroke-width="1" stroke-opacity="0.35"/>
  <text x="88" y="228" font-family="'Microsoft YaHei', 'PingFang SC', Arial, sans-serif" font-size="26" font-weight="700" fill="#4FC3F7">数据环境</text>
  <text x="88" y="268" font-family="'Microsoft YaHei', 'PingFang SC', Arial, sans-serif" font-size="20" fill="#E8F0FA">SGP 集群（T 站海外数据）</text>
  <text x="88" y="302" font-family="'Microsoft YaHei', 'PingFang SC', Arial, sans-serif" font-size="18" fill="#8FA8C8">dw_ticketdb.edw_log_ttd_traffic_order_d_ext</text>
  <text x="88" y="336" font-family="'Microsoft YaHei', 'PingFang SC', Arial, sans-serif" font-size="18" fill="#8FA8C8">过滤：page_ct='trip' + sub_bu_name='ibu门票'</text>
  <text x="88" y="380" font-family="'Microsoft YaHei', 'PingFang SC', Arial, sans-serif" font-size="16" fill="#5C7590">数据周期：2026-08-10 ～ 08-17（完整 7 天）</text>

  <!-- Right glass card: 统计口径 -->
  <rect x="660" y="180" width="560" height="240" rx="16" fill="#FFB74D" fill-opacity="0.05" stroke="#FFB74D" stroke-width="1" stroke-opacity="0.25"/>
  <text x="688" y="228" font-family="'Microsoft YaHei', 'PingFang SC', Arial, sans-serif" font-size="26" font-weight="700" fill="#FFB74D">统计口径</text>
  <text x="688" y="268" font-family="'Microsoft YaHei', 'PingFang SC', Arial, sans-serif" font-size="20" fill="#E8F0FA">站点：按 locale 字段（语言站）</text>
  <text x="688" y="302" font-family="'Microsoft YaHei', 'PingFang SC', Arial, sans-serif" font-size="18" fill="#8FA8C8">PV = count(distinct com_pv)</text>
  <text x="688" y="336" font-family="'Microsoft YaHei', 'PingFang SC', Arial, sans-serif" font-size="18" fill="#8FA8C8">UV = count(distinct vid)</text>
  <text x="688" y="380" font-family="'Microsoft YaHei', 'PingFang SC', Arial, sans-serif" font-size="16" fill="#5C7590">流量来源：trip_channel</text>

  <!-- Bottom note -->
  <rect x="60" y="450" width="1160" height="60" rx="12" fill="#FF6B6B" fill-opacity="0.08" stroke="#FF6B6B" stroke-width="1" stroke-opacity="0.3"/>
  <text x="100" y="486" font-family="'Microsoft YaHei', 'PingFang SC', Arial, sans-serif" font-size="18" fill="#E8F0FA">⚠ 提示：上一轮按景点统计有偏差，本次已修正为按语言站口径重新统计</text>

  <!-- Language examples -->
  <rect x="60" y="540" width="345" height="60" rx="12" fill="#1A2D4A" fill-opacity="0.6" stroke="#4FC3F7" stroke-width="1" stroke-opacity="0.3"/>
  <text x="90" y="577" font-family="'Microsoft YaHei', 'PingFang SC', Arial, sans-serif" font-size="18" fill="#E8F0FA">zh-hk = 香港繁体</text>
  <rect x="425" y="540" width="345" height="60" rx="12" fill="#1A2D4A" fill-opacity="0.6" stroke="#4FC3F7" stroke-width="1" stroke-opacity="0.3"/>
  <text x="455" y="577" font-family="'Microsoft YaHei', 'PingFang SC', Arial, sans-serif" font-size="18" fill="#E8F0FA">en-sg = 新加坡英文</text>
  <rect x="790" y="540" width="345" height="60" rx="12" fill="#1A2D4A" fill-opacity="0.6" stroke="#4FC3F7" stroke-width="1" stroke-opacity="0.3"/>
  <text x="820" y="577" font-family="'Microsoft YaHei', 'PingFang SC', Arial, sans-serif" font-size="18" fill="#E8F0FA">zh-tw = 台湾繁体</text>

  <text x="60" y="660" font-family="'Microsoft YaHei', 'PingFang SC', Arial, sans-serif" font-size="14" fill="#5C7590">全量共 50+ 个语言站</text>
  <text x="1220" y="660" font-family="'Microsoft YaHei', 'PingFang SC', Arial, sans-serif" font-size="14" fill="#5C7590" text-anchor="end">03</text>
</svg>
