<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <g id="bg">
    <rect width="1280" height="720" fill="#FFFFFF"/>
  </g>

  <g id="page-header">
    <rect x="60" y="46" width="4" height="28" fill="#0F4C81"/>
    <text x="76" y="70" font-family="Georgia, SimSun, 'Times New Roman', serif" font-size="42" font-weight="bold" fill="#0F4C81">ru-ru 俄语：SEO 自然流入型，占比 28.4% 全站最高</text>
    <text x="60" y="112" font-family="'Microsoft YaHei', 'PingFang SC', Arial, sans-serif" font-size="30" fill="#1B2430">俄罗斯用户大量通过搜索引擎自然流入，对投放依赖低。</text>
    <rect x="1040" y="92" width="180" height="34" rx="17" fill="#EEF2F6"/>
    <text x="1130" y="116" text-anchor="middle" font-family="'Microsoft YaHei', 'PingFang SC', Arial, sans-serif" font-size="18" font-weight="bold" fill="#E8833A">结构最特殊</text>
    <line x1="60" y1="150" x2="1220" y2="150" stroke="#D5DDE6" stroke-width="1"/>
  </g>

  <g id="site-volume">
    <text x="60" y="196" font-family="'Microsoft YaHei', 'PingFang SC', Arial, sans-serif" font-size="18" fill="#8A94A2">站点体量</text>
    <text x="60" y="262" font-family="Georgia, SimSun, 'Times New Roman', serif" font-size="56" font-weight="bold" fill="#0F4C81">PV 68,933</text>
    <text x="60" y="306" font-family="'Microsoft YaHei', 'PingFang SC', Arial, sans-serif" font-size="24" fill="#5A6675">PV 占比 3.4% · 语言站第 5 位</text>
    <text x="60" y="342" font-family="'Microsoft YaHei', 'PingFang SC', Arial, sans-serif" font-size="24" fill="#5A6675">UV 16,647</text>
    <line x1="60" y1="378" x2="620" y2="378" stroke="#D5DDE6" stroke-width="1"/>
  </g>

  <g id="site-channels">
    <text x="60" y="406" font-family="'Microsoft YaHei', 'PingFang SC', Arial, sans-serif" font-size="18" fill="#8A94A2">渠道结构（按该站自身占比）</text>

    <text x="60" y="433" font-family="'Microsoft YaHei', 'PingFang SC', Arial, sans-serif" font-size="18" fill="#1B2430">站内</text>
    <rect x="190" y="418" width="400" height="20" rx="4" fill="#E7EDF3"/>
    <rect x="190" y="418" width="181.1" height="20" rx="4" fill="#0F4C81"/>
    <text x="620" y="433" text-anchor="end" font-family="Consolas, 'Courier New', monospace" font-size="18" font-weight="bold" fill="#0F4C81">31.7%</text>

    <text x="60" y="471" font-family="'Microsoft YaHei', 'PingFang SC', Arial, sans-serif" font-size="18" fill="#1B2430">APP-PUSH</text>
    <rect x="190" y="456" width="400" height="20" rx="4" fill="#E7EDF3"/>
    <rect x="190" y="456" width="82.9" height="20" rx="4" fill="#4A90C4" fill-opacity="0.55"/>
    <text x="620" y="471" text-anchor="end" font-family="Consolas, 'Courier New', monospace" font-size="18" fill="#5A6675">14.5%</text>

    <text x="60" y="509" font-family="'Microsoft YaHei', 'PingFang SC', Arial, sans-serif" font-size="18" fill="#1B2430">Partner</text>
    <rect x="190" y="494" width="400" height="20" rx="4" fill="#E7EDF3"/>
    <rect x="190" y="494" width="60.6" height="20" rx="4" fill="#4A90C4" fill-opacity="0.55"/>
    <text x="620" y="509" text-anchor="end" font-family="Consolas, 'Courier New', monospace" font-size="18" fill="#5A6675">10.6%</text>

    <text x="60" y="547" font-family="'Microsoft YaHei', 'PingFang SC', Arial, sans-serif" font-size="18" fill="#1B2430">SEO</text>
    <rect x="190" y="532" width="400" height="20" rx="4" fill="#E7EDF3"/>
    <rect x="190" y="532" width="162.3" height="20" rx="4" fill="#E8833A"/>
    <text x="620" y="547" text-anchor="end" font-family="Consolas, 'Courier New', monospace" font-size="18" font-weight="bold" fill="#E8833A">28.4%</text>

    <text x="60" y="585" font-family="'Microsoft YaHei', 'PingFang SC', Arial, sans-serif" font-size="18" fill="#1B2430">PPC</text>
    <rect x="190" y="570" width="400" height="20" rx="4" fill="#E7EDF3"/>
    <rect x="190" y="570" width="68.6" height="20" rx="4" fill="#4A90C4" fill-opacity="0.55"/>
    <text x="620" y="585" text-anchor="end" font-family="Consolas, 'Courier New', monospace" font-size="18" fill="#5A6675">12.0%</text>

    <text x="60" y="623" font-family="'Microsoft YaHei', 'PingFang SC', Arial, sans-serif" font-size="18" fill="#1B2430">其他/EDM</text>
    <rect x="190" y="608" width="400" height="20" rx="4" fill="#E7EDF3"/>
    <rect x="190" y="608" width="16.0" height="20" rx="4" fill="#4A90C4" fill-opacity="0.55"/>
    <text x="620" y="623" text-anchor="end" font-family="Consolas, 'Courier New', monospace" font-size="18" fill="#5A6675">2.8%</text>
  </g>

  <g id="insight-seo">
    <use data-icon="tabler-outline/search" x="680" y="196" width="28" height="28" fill="#E8833A" stroke-width="2"/>
    <text x="720" y="220" font-family="'Microsoft YaHei', 'PingFang SC', Arial, sans-serif" font-size="28" font-weight="bold" fill="#E8833A">SEO 是这一站的主入口</text>
    <text x="680" y="268" font-family="'Microsoft YaHei', 'PingFang SC', Arial, sans-serif" font-size="24" fill="#1B2430">
      <tspan x="680" dy="0">SEO 占 28.4%（全站最高）</tspan>
      <tspan x="680" dy="34">远超其他渠道，说明俄罗斯</tspan>
      <tspan x="680" dy="34">用户大量通过搜索引擎自然流入。</tspan>
    </text>
  </g>

  <g id="insight-lowpaid">
    <line x1="680" y1="376" x2="1220" y2="376" stroke="#D5DDE6" stroke-width="1"/>
    <use data-icon="tabler-outline/route" x="680" y="400" width="28" height="28" fill="#0F4C81" stroke-width="2"/>
    <text x="720" y="424" font-family="'Microsoft YaHei', 'PingFang SC', Arial, sans-serif" font-size="28" font-weight="bold" fill="#0F4C81">对投放依赖最低</text>
    <text x="680" y="472" font-family="'Microsoft YaHei', 'PingFang SC', Arial, sans-serif" font-size="24" fill="#1B2430">
      <tspan x="680" dy="0">站内 31.7% 是六站最低，</tspan>
      <tspan x="680" dy="34">这一站的流量结构在五站里最特殊。</tspan>
    </text>
  </g>

  <g id="page-footer">
    <text x="60" y="694" font-family="'Microsoft YaHei', 'PingFang SC', Arial, sans-serif" font-size="16" fill="#8A94A2">数据窗口 2026-08-10 至 2026-08-17 · 站点口径 = locale 语言站</text>
    <text x="1220" y="694" text-anchor="end" font-family="Consolas, 'Courier New', monospace" font-size="16" fill="#8A94A2">P10 / 12</text>
  </g>
</svg>
