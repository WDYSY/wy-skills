    <text x="60" y="236" font-family="'Microsoft YaHei', 'PingFang SC', Arial, sans-serif" font-size="18" fill="#8A94A2">PV 55,648 · 占比 2.8% · UV 14,796</text>
    <line x1="60" y1="252" x2="620" y2="252" stroke="#E7EDF3" stroke-width="1"/>

    <text x="60" y="285" font-family="'Microsoft YaHei', 'PingFang SC', Arial, sans-serif" font-size="18" fill="#1B2430">站内</text>
    <rect x="170" y="270" width="360" height="20" rx="4" fill="#E7EDF3"/>
