    <text x="660" y="361" font-family="'Microsoft YaHei', 'PingFang SC', Arial, sans-serif" font-size="18" fill="#1B2430">Partner</text>
    <rect x="770" y="346" width="360" height="20" rx="4" fill="#E7EDF3"/>
    <rect x="770" y="346" width="105.4" height="20" rx="4" fill="#E8833A"/>
