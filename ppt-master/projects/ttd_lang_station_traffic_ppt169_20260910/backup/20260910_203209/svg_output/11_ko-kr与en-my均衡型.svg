  <g id="conclusion-band">
    <rect x="60" y="516" width="1160" height="92" rx="10" fill="#EEF2F6"/>
    <rect x="60" y="516" width="6" height="92" fill="#E8833A"/>
    <use data-icon="tabler-outline/adjustments" x="96" y="540" width="28" height="28" fill="#0F4C81" stroke-width="2"/>
    <text x="140" y="562" font-family="'Microsoft YaHei', 'PingFang SC', Arial, sans-serif" font-size="24" fill="#1B2430">两站没有明显短板，站内 44–55%，Partner / PPC / SEO 各占 8–16%。</text>
    <text x="96" y="594" font-family="'Microsoft YaHei', 'PingFang SC', Arial, sans-serif" font-size="24" fill="#5A6675">适合组合投放、小步试错，而不是押注单一渠道。</text>
  </g>

  <g id="page-footer">
    <text x="60" y="694" font-family="'Microsoft YaHei', 'PingFang SC', Arial, sans-serif" font-size="16" fill="#8A94A2">数据窗口 2026-08-10 至 2026-08-17 · 两条微条共用同一 0–55% 刻度</text>
    <text x="1220" y="694" text-anchor="end" font-family="Consolas, 'Courier New', monospace" font-size="16" fill="#8A94A2">P11 / 12</text>
  </g>
