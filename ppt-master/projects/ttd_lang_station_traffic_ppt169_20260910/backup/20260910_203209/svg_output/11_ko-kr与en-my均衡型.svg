    <text x="60" y="323" font-family="'Microsoft YaHei', 'PingFang SC', Arial, sans-serif" font-size="18" fill="#1B2430">APP-PUSH</text>
    <rect x="170" y="308" width="360" height="20" rx="4" fill="#E7EDF3"/>
    <rect x="170" y="308" width="42.5" height="20" rx="4" fill="#4A90C4" fill-opacity="0.55"/>
    <text x="610" y="323" text-anchor="end" font-family="Consolas, 'Courier New', monospace" font-size="18" fill="#5A6675">6.5%</text>

    <text x="60" y="361" font-family="'Microsoft YaHei', 'PingFang SC', Arial, sans-serif" font-size="18" fill="#1B2430">Partner</text>
    <rect x="170" y="346" width="360" height="20" rx="4" fill="#E7EDF3"/>
    <rect x="170" y="346" width="98.2" height="20" rx="4" fill="#E8833A"/>
    <text x="610" y="361" text-anchor="end" font-family="Consolas, 'Courier New', monospace" font-size="18" font-weight="bold" fill="#E8833A">15.0%</text>

    <text x="60" y="399" font-family="'Microsoft YaHei', 'PingFang SC', Arial, sans-serif" font-size="18" fill="#1B2430">SEO</text>
