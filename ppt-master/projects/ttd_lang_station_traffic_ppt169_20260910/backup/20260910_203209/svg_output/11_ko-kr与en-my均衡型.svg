<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <g id="bg">
    <rect width="1280" height="720" fill="#FFFFFF"/>
  </g>

  <g id="page-header">
    <rect x="60" y="46" width="4" height="28" fill="#0F4C81"/>
    <text x="76" y="70" font-family="Georgia, SimSun, 'Times New Roman', serif" font-size="42" font-weight="bold" fill="#0F4C81">ko-kr 与 en-my：多渠道并进，没有单一依赖</text>
    <text x="60" y="112" font-family="'Microsoft YaHei', 'PingFang SC', Arial, sans-serif" font-size="30" fill="#1B2430">韩语与马来英文两站的渠道构成相对均衡，站内 44%–55%，其余渠道各占 8%–16%。</text>
    <line x1="60" y1="150" x2="1220" y2="150" stroke="#D5DDE6" stroke-width="1"/>
  </g>

