  <g id="chart-note">
    <text x="60" y="668" font-family="'Microsoft YaHei', 'PingFang SC', Arial, sans-serif" font-size="16" fill="#8A94A2">注：榜内各行占比为分别四舍五入后的值，合计 89.1% 与全站口径 TOP10 = 88.6% 存在 0.5pp 舍入差。</text>
  </g>

  <g id="page-footer">
    <text x="60" y="694" font-family="'Microsoft YaHei', 'PingFang SC', Arial, sans-serif" font-size="16" fill="#8A94A2">全量共 50+ 个语言站 · PV = count(distinct com_pv) · UV = count(distinct vid)</text>
    <text x="1220" y="694" text-anchor="end" font-family="Consolas, 'Courier New', monospace" font-size="16" fill="#8A94A2">P04 / 12</text>
