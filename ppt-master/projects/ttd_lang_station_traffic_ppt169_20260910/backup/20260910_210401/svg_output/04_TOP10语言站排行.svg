    <text x="76" y="70" font-family="Georgia, SimSun, 'Times New Roman', serif" font-size="42" font-weight="bold" fill="#0F4C81">TOP10 语言站：港澳台与新加坡撑起近九成流量</text>
    <text x="60" y="112" font-family="'Microsoft YaHei', 'PingFang SC', Arial, sans-serif" font-size="30" fill="#1B2430">TOP10 语言站贡献 <tspan fill="#E8833A" font-weight="bold">88.6%</tspan> 的 PV，其中香港繁体与新加坡英文两家就占 <tspan fill="#E8833A" font-weight="bold">59%</tspan>。</text>
    <line x1="60" y1="146" x2="1220" y2="146" stroke="#D5DDE6" stroke-width="1"/>
  </g>

