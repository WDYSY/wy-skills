    <text fill="#1B2430" font-family="'Microsoft YaHei', 'PingFang SC', Arial, sans-serif" font-size="24" x="680" y="472">这一结构很可能与 BIGBANG 新加坡</text><text fill="#1B2430" font-family="'Microsoft YaHei', 'PingFang SC', Arial, sans-serif" font-size="24" x="680" y="506">演唱会等演出的开票提醒强绑定。</text></g>

