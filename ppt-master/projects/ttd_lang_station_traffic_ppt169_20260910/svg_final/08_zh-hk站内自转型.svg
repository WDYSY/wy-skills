    <text x="720" y="458" font-family="'Microsoft YaHei', 'PingFang SC', Arial, sans-serif" font-size="28" font-weight="bold" fill="#E8833A">Partner 联盟是第二抓手</text>
    <text fill="#1B2430" font-family="'Microsoft YaHei', 'PingFang SC', Arial, sans-serif" font-size="24" x="680" y="506">Partner 13.3% 是这一站对外渠道中的</text><text fill="#1B2430" font-family="'Microsoft YaHei', 'PingFang SC', Arial, sans-serif" font-size="24" x="680" y="540">最高一项，也是最值得继续放大的抓手。</text></g>

