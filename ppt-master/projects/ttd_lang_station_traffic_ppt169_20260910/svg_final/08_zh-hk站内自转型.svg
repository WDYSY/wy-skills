    <text x="60" y="471" font-family="'Microsoft YaHei', 'PingFang SC', Arial, sans-serif" font-size="18" fill="#1B2430">APP-PUSH</text>
    <path fill="#E7EDF3" d="M194,456 H586 A4,4 0 0 1 590,460 V472 A4,4 0 0 1 586,476 H194 A4,4 0 0 1 190,472 V460 A4,4 0 0 1 194,456 Z" />
