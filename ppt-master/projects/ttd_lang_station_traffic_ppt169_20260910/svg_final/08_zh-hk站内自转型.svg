    <text x="720" y="220" font-family="'Microsoft YaHei', 'PingFang SC', Arial, sans-serif" font-size="28" font-weight="bold" fill="#0F4C81">站内自发流转，占比全站最高</text>
    <text fill="#1B2430" font-family="'Microsoft YaHei', 'PingFang SC', Arial, sans-serif" font-size="24" x="680" y="268">站内 66.6% 是所有站里最高的——</text><text fill="#1B2430" font-family="'Microsoft YaHei', 'PingFang SC', Arial, sans-serif" font-size="24" x="680" y="302">香港用户多在平台内自发流转</text><text fill="#1B2430" font-family="'Microsoft YaHei', 'PingFang SC', Arial, sans-serif" font-size="24" x="680" y="336">（跨业务跳转 / 历史访问），</text><text fill="#1B2430" font-family="'Microsoft YaHei', 'PingFang SC', Arial, sans-serif" font-size="24" x="680" y="370">对外投放依赖低。</text></g>

  <g id="insight-partner">
    <line x1="680" y1="410" x2="1220" y2="410" stroke="#D5DDE6" stroke-width="1" />
    
