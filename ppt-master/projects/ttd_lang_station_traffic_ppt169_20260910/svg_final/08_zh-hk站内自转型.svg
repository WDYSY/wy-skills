    <path fill="#4A90C4" fill-opacity="0.55" d="M194,532 H211.70 A4,4 0 0 1 215.70,536 V548 A4,4 0 0 1 211.70,552 H194 A4,4 0 0 1 190,548 V536 A4,4 0 0 1 194,532 Z" />
    <text x="644" y="547" text-anchor="end" font-family="Consolas, 'Courier New', monospace" font-size="18" fill="#5A6675">4.5%</text>

    <text x="60" y="585" font-family="'Microsoft YaHei', 'PingFang SC', Arial, sans-serif" font-size="18" fill="#1B2430">PPC</text>
    <path fill="#E7EDF3" d="M194,570 H586 A4,4 0 0 1 590,574 V586 A4,4 0 0 1 586,590 H194 A4,4 0 0 1 190,586 V574 A4,4 0 0 1 194,570 Z" />
    <path fill="#4A90C4" fill-opacity="0.55" d="M194,570 H214.60 A4,4 0 0 1 218.60,574 V586 A4,4 0 0 1 214.60,590 H194 A4,4 0 0 1 190,586 V574 A4,4 0 0 1 194,570 Z" />
    <text x="644" y="585" text-anchor="end" font-family="Consolas, 'Courier New', monospace" font-size="18" fill="#5A6675">5.0%</text>

    <text x="60" y="623" font-family="'Microsoft YaHei', 'PingFang SC', Arial, sans-serif" font-size="18" fill="#1B2430">其他/EDM</text>
    <path fill="#E7EDF3" d="M194,608 H586 A4,4 0 0 1 590,612 V624 A4,4 0 0 1 586,628 H194 A4,4 0 0 1 190,624 V612 A4,4 0 0 1 194,608 Z" />
    <path fill="#4A90C4" fill-opacity="0.55" d="M194,608 H215.70 A4,4 0 0 1 219.70,612 V624 A4,4 0 0 1 215.70,628 H194 A4,4 0 0 1 190,624 V612 A4,4 0 0 1 194,608 Z" />
    <text x="644" y="623" text-anchor="end" font-family="Consolas, 'Courier New', monospace" font-size="18" fill="#5A6675">5.2%</text>
