    <text x="96" y="590" font-family="'Microsoft YaHei', 'PingFang SC', Arial, sans-serif" font-size="24" fill="#FFFFFF" fill-opacity="0.85">是 Partner 联盟、SEO、APP-PUSH 与 PPC。</text>
    <text x="96" y="626" font-family="'Microsoft YaHei', 'PingFang SC', Arial, sans-serif" font-size="18" fill="#FFFFFF" fill-opacity="0.65">但四个抓手在每个语言站的配比差异巨大——这正是「一站一策」的依据。</text>
