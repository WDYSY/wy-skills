    <text fill="#1B2430" font-family="'Microsoft YaHei', 'PingFang SC', Arial, sans-serif" font-size="30" x="60" y="112"><tspan>语言站流量高度头部集中：TOP2 占 <tspan fill="#E8833A" font-weight="bold">59%</tspan>、TOP10 占 <tspan fill="#E8833A" font-weight="bold">88.6%</tspan>，</tspan>
      </text><text fill="#1B2430" font-family="'Microsoft YaHei', 'PingFang SC', Arial, sans-serif" font-size="30" x="60" y="150">但各语言站的渠道结构差异巨大——对外投放必须按站定制。</text><line x1="60" y1="172" x2="1220" y2="172" stroke="#D5DDE6" stroke-width="1" />
