  <g id="fingerprint-notes">
    <path fill="#0F4C81" d="M724,214 H724 A4,4 0 0 1 728,218 V238 A4,4 0 0 1 724,242 H724 A4,4 0 0 1 720,238 V218 A4,4 0 0 1 724,214 Z" />
    <text x="744" y="240" font-family="'Microsoft YaHei', 'PingFang SC', Arial, sans-serif" font-size="28" font-weight="bold" fill="#0F4C81">zh-hk 站内凸起</text>
    <text fill="#5A6675" font-family="'Microsoft YaHei', 'PingFang SC', Arial, sans-serif" font-size="18" x="720" y="280">站内 66.6% 把整条形状向外推，</text><text fill="#5A6675" font-family="'Microsoft YaHei', 'PingFang SC', Arial, sans-serif" font-size="18" x="720" y="306">其余维度普遍收敛在 4.5%–13.3%。</text><path fill="#E8833A" d="M724,342 H724 A4,4 0 0 1 728,346 V366 A4,4 0 0 1 724,370 H724 A4,4 0 0 1 720,366 V346 A4,4 0 0 1 724,342 Z" />
    <text x="744" y="368" font-family="'Microsoft YaHei', 'PingFang SC', Arial, sans-serif" font-size="28" font-weight="bold" fill="#E8833A">en-sg 的 Push 尖角</text>
    <text fill="#5A6675" font-family="'Microsoft YaHei', 'PingFang SC', Arial, sans-serif" font-size="18" x="720" y="408">APP-PUSH 23.0% 是全站最高，</text><text fill="#5A6675" font-family="'Microsoft YaHei', 'PingFang SC', Arial, sans-serif" font-size="18" x="720" y="434">在雷达上形成唯一明显外突的角。</text><path fill="#4A90C4" d="M724,470 H724 A4,4 0 0 1 728,474 V494 A4,4 0 0 1 724,498 H724 A4,4 0 0 1 720,494 V474 A4,4 0 0 1 724,470 Z" />
    <text x="744" y="496" font-family="'Microsoft YaHei', 'PingFang SC', Arial, sans-serif" font-size="28" font-weight="bold" fill="#4A90C4">ru-ru 的 SEO 长刺</text>
    <text fill="#5A6675" font-family="'Microsoft YaHei', 'PingFang SC', Arial, sans-serif" font-size="18" x="720" y="536">SEO 28.4% 远超其他渠道，</text><text fill="#5A6675" font-family="'Microsoft YaHei', 'PingFang SC', Arial, sans-serif" font-size="18" x="720" y="562">站内 31.7% 却是六站最低。</text></g>

  <g id="page-note">
    <text x="60" y="668" font-family="'Microsoft YaHei', 'PingFang SC', Arial, sans-serif" font-size="16" fill="#8A94A2">维度为该站渠道占比（%），三条系列共用同一 0–70% 刻度——四道同心环分别为 17.5% / 35% / 52.5% / 70%，故形状可直接横向比较。</text>
  </g>

