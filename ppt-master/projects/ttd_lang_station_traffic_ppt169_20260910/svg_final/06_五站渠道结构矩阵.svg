    <text x="76" y="70" font-family="Georgia, SimSun, 'Times New Roman', serif" font-size="42" font-weight="bold" fill="#0F4C81">五站渠道结构：站内仍是主力，但差异极大</text>
    <text fill="#1B2430" font-family="'Microsoft YaHei', 'PingFang SC', Arial, sans-serif" font-size="30" x="60" y="110"><tspan>站内流量在各站占 <tspan fill="#E8833A" font-weight="bold">31.7%–66.6%</tspan>；</tspan>
