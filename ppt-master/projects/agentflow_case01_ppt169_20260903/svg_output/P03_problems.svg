<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <title>P03 - 三类核心问题</title>
  <desc>客服与销售支持最适合率先规模化，dense类型，3列卡片</desc>
  <!-- 背景 -->
  <rect width="1280" height="720" fill="#F7F8FA"/>
  <!-- 页眉 -->
  <rect x="0" y="0" width="1280" height="52" fill="#17324D"/>
  <text x="64" y="35" font-family="Microsoft YaHei, Arial, sans-serif" font-size="16" fill="#8A94A1">P03 · 问题拆解</text>
  <!-- 标题 -->
  <text x="64" y="100" font-family="Cambria, SimSun, serif" font-size="42" font-weight="bold" fill="#17324D">单点工具难以跨团队复制</text>
  <text x="64" y="148" font-family="Cambria, SimSun, serif" font-size="42" font-weight="bold" fill="#17324D">流程断裂才是核心阻力</text>
  <rect x="64" y="168" width="80" height="3" fill="#1F6FB2"/>
  <!-- 副标题 -->
  <text x="64" y="200" font-family="Microsoft YaHei, Arial, sans-serif" font-size="24" fill="#5B6773">知识分散、流程断裂、价值难复制 — 三类结构性问题构成规模化阻力</text>

  <!-- 三列卡片 -->
  <!-- Card 1: 知识分散 -->
  <g transform="translate(64, 228)">
    <rect x="0" y="0" width="368" height="340" rx="12" fill="#EEF1F4" stroke="#D8DEE6" stroke-width="1"/>
    <!-- 顶部色条 -->
    <rect x="0" y="0" width="368" height="8" rx="12" fill="#C44E3B"/>
    <rect x="0" y="8" width="368" height="8" fill="#C44E3B"/>
    <!-- 图标区 -->
    <rect x="24" y="32" width="56" height="56" rx="12" fill="#C44E3B" opacity="0.12"/>
    <!-- 简单书本/知识图标 -->
    <g transform="translate(38, 46)" stroke="#C44E3B" stroke-width="2" fill="none">
      <rect x="0" y="0" width="28" height="28" rx="3"/>
      <line x1="4" y1="8" x2="24" y2="8"/>
      <line x1="4" y1="14" x2="24" y2="14"/>
      <line x1="4" y1="20" x2="16" y2="20"/>
    </g>
    <!-- 卡片标题 -->
    <text x="24" y="112" font-family="Microsoft YaHei, Arial, sans-serif" font-size="28" font-weight="600" fill="#17324D">知识分散</text>
    <text x="24" y="148" font-family="Microsoft YaHei, Arial, sans-serif" font-size="20" fill="#1F2933">口径不一致，检索效率低</text>
    <!-- 问题列表 -->
    <g transform="translate(24, 168)">
      <circle cx="8" cy="8" r="4" fill="#C44E3B"/>
      <text x="24" y="14" font-family="Microsoft YaHei, Arial, sans-serif" font-size="18" fill="#1F2933">客服口径与销售不一致</text>
    </g>
    <g transform="translate(24, 200)">
      <circle cx="8" cy="8" r="4" fill="#C44E3B"/>
      <text x="24" y="14" font-family="Microsoft YaHei, Arial, sans-serif" font-size="18" fill="#1F2933">产品知识更新滞后</text>
    </g>
    <g transform="translate(24, 232)">
      <circle cx="8" cy="8" r="4" fill="#C44E3B"/>
      <text x="24" y="14" font-family="Microsoft YaHei, Arial, sans-serif" font-size="18" fill="#1F2933">跨部门知识检索成本高</text>
    </g>
    <g transform="translate(24, 264)">
      <circle cx="8" cy="8" r="4" fill="#C44E3B"/>
      <text x="24" y="14" font-family="Microsoft YaHei, Arial, sans-serif" font-size="18" fill="#1F2933">历史会话价值未被沉淀</text>
    </g>
    <!-- 底部警示 -->
    <rect x="24" y="296" width="320" height="28" rx="6" fill="#C44E3B" opacity="0.1"/>
    <text x="184" y="316" font-family="Microsoft YaHei, Arial, sans-serif" font-size="16" fill="#C44E3B" text-anchor="middle">决策依据散落，无法复用</text>
  </g>

  <!-- Card 2: 流程断裂 -->
  <g transform="translate(456, 228)">
    <rect x="0" y="0" width="368" height="340" rx="12" fill="#EEF1F4" stroke="#D8DEE6" stroke-width="1"/>
    <rect x="0" y="0" width="368" height="8" rx="12" fill="#C44E3B"/>
    <rect x="0" y="8" width="368" height="8" fill="#C44E3B"/>
    <!-- 图标 -->
    <rect x="24" y="32" width="56" height="56" rx="12" fill="#C44E3B" opacity="0.12"/>
    <!-- 断裂箭头图标 -->
    <g transform="translate(38, 46)" stroke="#C44E3B" stroke-width="2" fill="none">
      <line x1="0" y1="14" x2="28" y2="14"/>
      <polyline points="20,8 28,14 20,20"/>
      <line x1="14" y1="14" x2="14" y2="28"/>
      <circle cx="14" cy="14" r="3"/>
    </g>
    <text x="24" y="112" font-family="Microsoft YaHei, Arial, sans-serif" font-size="28" font-weight="600" fill="#17324D">流程断裂</text>
    <text x="24" y="148" font-family="Microsoft YaHei, Arial, sans-serif" font-size="20" fill="#1F2933">跨系统转写、升级与催办成本高</text>
    <g transform="translate(24, 168)">
      <circle cx="8" cy="8" r="4" fill="#C44E3B"/>
      <text x="24" y="14" font-family="Microsoft YaHei, Arial, sans-serif" font-size="18" fill="#1F2933">客服→销售信息手动传递</text>
    </g>
    <g transform="translate(24, 200)">
      <circle cx="8" cy="8" r="4" fill="#C44E3B"/>
      <text x="24" y="14" font-family="Microsoft YaHei, Arial, sans-serif" font-size="18" fill="#1F2933">升级流程缺乏自动化触发</text>
    </g>
    <g transform="translate(24, 232)">
      <circle cx="8" cy="8" r="4" fill="#C44E3B"/>
      <text x="24" y="14" font-family="Microsoft YaHei, Arial, sans-serif" font-size="18" fill="#1F2933">跨部门任务无统一追踪</text>
    </g>
    <g transform="translate(24, 264)">
      <circle cx="8" cy="8" r="4" fill="#C44E3B"/>
      <text x="24" y="14" font-family="Microsoft YaHei, Arial, sans-serif" font-size="18" fill="#1F2933">结果回写依赖人工操作</text>
    </g>
    <rect x="24" y="296" width="320" height="28" rx="6" fill="#C44E3B" opacity="0.1"/>
    <text x="184" y="316" font-family="Microsoft YaHei, Arial, sans-serif" font-size="16" fill="#C44E3B" text-anchor="middle">协同效率止步于手动操作</text>
  </g>

  <!-- Card 3: 价值难复制 -->
  <g transform="translate(848, 228)">
    <rect x="0" y="0" width="368" height="340" rx="12" fill="#EEF1F4" stroke="#D8DEE6" stroke-width="1"/>
    <rect x="0" y="0" width="368" height="8" rx="12" fill="#7FA9D6"/>
    <rect x="0" y="8" width="368" height="8" fill="#7FA9D6"/>
    <!-- 图标 -->
    <rect x="24" y="32" width="56" height="56" rx="12" fill="#7FA9D6" opacity="0.12"/>
    <!-- 复制/堆叠图标 -->
    <g transform="translate(38, 46)" stroke="#7FA9D6" stroke-width="2" fill="none">
      <rect x="0" y="0" width="24" height="20" rx="3"/>
      <rect x="4" y="8" width="24" height="20" rx="3"/>
      <line x1="18" y1="4" x2="28" y2="4"/>
      <line x1="28" y1="4" x2="28" y2="28"/>
    </g>
    <text x="24" y="112" font-family="Microsoft YaHei, Arial, sans-serif" font-size="28" font-weight="600" fill="#17324D">价值难复制</text>
    <text x="24" y="148" font-family="Microsoft YaHei, Arial, sans-serif" font-size="20" fill="#1F2933">成果停留在局部提效</text>
    <g transform="translate(24, 168)">
      <circle cx="8" cy="8" r="4" fill="#7FA9D6"/>
      <text x="24" y="14" font-family="Microsoft YaHei, Arial, sans-serif" font-size="18" fill="#1F2933">单点成功无法推广至全流程</text>
    </g>
    <g transform="translate(24, 200)">
      <circle cx="8" cy="8" r="4" fill="#7FA9D6"/>
      <text x="24" y="14" font-family="Microsoft YaHei, Arial, sans-serif" font-size="18" fill="#1F2933">经验依赖个人而非系统</text>
    </g>
    <g transform="translate(24, 232)">
      <circle cx="8" cy="8" r="4" fill="#7FA9D6"/>
      <text x="24" y="14" font-family="Microsoft YaHei, Arial, sans-serif" font-size="18" fill="#1F2933">缺乏可复制的最佳实践模板</text>
    </g>
    <g transform="translate(24, 264)">
      <circle cx="8" cy="8" r="4" fill="#7FA9D6"/>
      <text x="24" y="14" font-family="Microsoft YaHei, Arial, sans-serif" font-size="18" fill="#1F2933">新场景需要从零搭建</text>
    </g>
    <rect x="24" y="296" width="320" height="28" rx="6" fill="#7FA9D6" opacity="0.1"/>
    <text x="184" y="316" font-family="Microsoft YaHei, Arial, sans-serif" font-size="16" fill="#1F6FB2" text-anchor="middle">局部最优≠全局最优</text>
  </g>

  <!-- 页脚 -->
  <text x="64" y="700" font-family="Microsoft YaHei, Arial, sans-serif" font-size="14" fill="#8A94A1">agentflow_case01 · P03</text>
  <text x="1216" y="700" font-family="Microsoft YaHei, Arial, sans-serif" font-size="14" fill="#8A94A1" text-anchor="end">1 / 6</text>
</svg>
