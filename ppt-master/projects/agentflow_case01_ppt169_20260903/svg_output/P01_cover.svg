<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <title>P01 - AI Agent 商业化落地方案封面</title>
  <desc>封面页，anchor类型，16:9格式</desc>
  <!-- 背景 -->
  <rect width="1280" height="720" fill="#F7F8FA"/>
  <!-- 顶部细线 -->
  <rect x="0" y="0" width="1280" height="5" fill="#1F6FB2"/>
  <!-- 左侧主装饰条 -->
  <rect x="0" y="0" width="10" height="720" fill="#17324D"/>
  <!-- 左下几何装饰 - opacity 0.07 on each child -->
  <rect x="30" y="500" width="200" height="200" rx="12" fill="#17324D" fill-opacity="0.07"/>
  <rect x="80" y="440" width="160" height="160" rx="8" fill="#17324D" fill-opacity="0.07"/>
  <rect x="130" y="530" width="220" height="170" rx="6" fill="#17324D" fill-opacity="0.07"/>
  <!-- 右上圆形装饰 - opacity 0.06 on each child -->
  <circle cx="1150" cy="80" r="130" fill="#1F6FB2" fill-opacity="0.06"/>
  <circle cx="1070" cy="170" r="90" fill="#1F6FB2" fill-opacity="0.06"/>
  <circle cx="1220" cy="190" r="70" fill="#1F6FB2" fill-opacity="0.06"/>
  <!-- 标题下装饰短线 -->
  <rect x="64" y="400" width="72" height="3" fill="#1F6FB2"/>
  <!-- 主标题 -->
  <text x="64" y="468" font-family="Cambria, SimSun, serif" font-size="66" font-weight="bold" fill="#17324D">AI Agent 商业化</text>
  <text x="64" y="542" font-family="Cambria, SimSun, serif" font-size="66" font-weight="bold" fill="#17324D">从"可试用"到"可落地"</text>
  <!-- 副标题 -->
  <text x="64" y="590" font-family="Microsoft YaHei, Arial, sans-serif" font-size="24" fill="#5B6773">企业客户服务与销售协同中的平台化落地方案</text>
  <!-- 底部信息栏 -->
  <rect x="0" y="660" width="1280" height="60" fill="#17324D"/>
  <text x="64" y="698" font-family="Microsoft YaHei, Arial, sans-serif" font-size="16" fill="#8A94A1">面向：企业客户决策层 · 咨询顾问 · 潜在投资人</text>
  <text x="1216" y="698" font-family="Microsoft YaHei, Arial, sans-serif" font-size="16" fill="#8A94A1" text-anchor="end">agentflow_case01 · 2026-09-03</text>
</svg>
