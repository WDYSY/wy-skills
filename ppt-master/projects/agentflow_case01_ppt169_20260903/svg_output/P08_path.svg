    <g transform="translate(12, 228)">
      <circle cx="8" cy="8" r="4" fill="#7FA9D6"/>
      <text x="20" y="14" font-family="Microsoft YaHei, Arial, sans-serif" font-size="16" fill="#1F2933">多租户运营体系</text>
    </g>
    <g transform="translate(12, 260)">
      <circle cx="8" cy="8" r="4" fill="#7FA9D6"/>
      <text x="20" y="14" font-family="Microsoft YaHei, Arial, sans-serif" font-size="16" fill="#1F2933">生态合作与 API 变现</text>
    </g>
    <g transform="translate(12, 292)">
      <circle cx="8" cy="8" r="4" fill="#7FA9D6"/>
      <text x="20" y="14" font-family="Microsoft YaHei, Arial, sans-serif" font-size="16" fill="#1F2933">平台规模化 → 利润率提升</text>
    </g>
    <rect x="12" y="320" width="228" height="28" rx="6" fill="#7FA9D6" opacity="0.15"/>
    <text x="126" y="340" font-family="Microsoft YaHei, Arial, sans-serif" font-size="16" fill="#1F6FB2" text-anchor="middle">平台费 + 生态分成</text>
    <text x="126" y="356" font-family="Microsoft YaHei, Arial, sans-serif" font-size="14" fill="#5B6773" text-anchor="middle">持续规模增长</text>
  </g>

  <!-- 页脚 -->
  <text x="64" y="700" font-family="Microsoft YaHei, Arial, sans-serif" font-size="14" fill="#8A94A1">agentflow_case01 · P08</text>
  <text x="1216" y="700" font-family="Microsoft YaHei, Arial, sans-serif" font-size="14" fill="#8A94A1" text-anchor="end">6 / 6</text>
</svg>
