    <text x="120" y="340" font-family="Microsoft YaHei, Arial, sans-serif" font-size="16" fill="#17324D" text-anchor="middle">订阅 + 调度量</text>
    <text x="120" y="356" font-family="Microsoft YaHei, Arial, sans-serif" font-size="14" fill="#5B6773" text-anchor="middle">周期：3-6 个月</text>
  </g>

  <!-- 连接箭头 3→4 -->
