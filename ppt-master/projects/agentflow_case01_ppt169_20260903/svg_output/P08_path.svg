    <text x="80" y="67" font-family="Cambria, SimSun, serif" font-size="24" font-weight="bold" fill="white" text-anchor="middle">4</text>
    <rect x="0" y="96" width="252" height="260" rx="12" fill="#EEF1F4" stroke="#7FA9D6" stroke-width="2"/>
    <rect x="0" y="96" width="252" height="10" rx="12" fill="#7FA9D6"/>
    <rect x="0" y="106" width="252" height="10" fill="#7FA9D6"/>
    <text x="126" y="136" font-family="Microsoft YaHei, Arial, sans-serif" font-size="22" font-weight="600" fill="#17324D" text-anchor="middle">平台化扩张</text>
    <text x="126" y="164" font-family="Microsoft YaHei, Arial, sans-serif" font-size="16" fill="#5B6773" text-anchor="middle">多行业 / 多BU 复制</text>
    <rect x="12" y="180" width="228" height="1" fill="#D8DEE6"/>
    <g transform="translate(12, 196)">
