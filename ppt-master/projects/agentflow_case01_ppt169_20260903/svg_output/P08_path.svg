<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <title>P08 - 商业化扩张路径</title>
  <desc>四阶段扩张路径，dense类型</desc>
  <rect width="1280" height="720" fill="#F7F8FA"/>
  <rect x="0" y="0" width="1280" height="52" fill="#17324D"/>
  <text x="64" y="35" font-family="Microsoft YaHei, Arial, sans-serif" font-size="16" fill="#8A94A1">P08 · 商业路径</text>
  <!-- 标题 -->
  <text x="64" y="100" font-family="Cambria, SimSun, serif" font-size="42" font-weight="bold" fill="#17324D">最优商业化路径：逐层放大已验证能力</text>
  <rect x="64" y="120" width="80" height="3" fill="#1F6FB2"/>
  <text x="64" y="152" font-family="Microsoft YaHei, Arial, sans-serif" font-size="24" fill="#5B6773">订阅费 + 调度量计费 + 实施服务费 → 稳定收入结构</text>

  <!-- 四阶段时间线 -->
  <!-- 连接线背景 -->
  <rect x="64" y="248" width="1152" height="8" rx="4" fill="#D8DEE6"/>

  <!-- 阶段1 -->
  <g transform="translate(64, 196)">
    <circle cx="80" cy="60" r="24" fill="#1F6FB2"/>
    <text x="80" y="67" font-family="Cambria, SimSun, serif" font-size="24" font-weight="bold" fill="white" text-anchor="middle">1</text>
    <rect x="0" y="96" width="240" height="260" rx="12" fill="#EEF1F4" stroke="#1F6FB2" stroke-width="2"/>
    <rect x="0" y="96" width="240" height="10" rx="12" fill="#1F6FB2"/>
    <rect x="0" y="106" width="240" height="10" fill="#1F6FB2"/>
    <text x="120" y="136" font-family="Microsoft YaHei, Arial, sans-serif" font-size="22" font-weight="600" fill="#17324D" text-anchor="middle">单部门试点</text>
    <text x="120" y="164" font-family="Microsoft YaHei, Arial, sans-serif" font-size="16" fill="#5B6773" text-anchor="middle">客服 or 销售支持</text>
    <rect x="12" y="180" width="216" height="1" fill="#D8DEE6"/>
    <!-- 里程碑 -->
    <g transform="translate(12, 196)">
      <circle cx="8" cy="8" r="4" fill="#1F6FB2"/>
      <text x="20" y="14" font-family="Microsoft YaHei, Arial, sans-serif" font-size="16" fill="#1F2933">选定 1 个高频场景</text>
    </g>
    <g transform="translate(12, 228)">
      <circle cx="8" cy="8" r="4" fill="#1F6FB2"/>
      <text x="20" y="14" font-family="Microsoft YaHei, Arial, sans-serif" font-size="16" fill="#1F2933">Agent + 知识库上线</text>
    </g>
    <g transform="translate(12, 260)">
      <circle cx="8" cy="8" r="4" fill="#1F6FB2"/>
      <text x="20" y="14" font-family="Microsoft YaHei, Arial, sans-serif" font-size="16" fill="#1F2933">4 周内跑通基础闭环</text>
    </g>
    <g transform="translate(12, 292)">
      <circle cx="8" cy="8" r="4" fill="#1F6FB2"/>
      <text x="20" y="14" font-family="Microsoft YaHei, Arial, sans-serif" font-size="16" fill="#1F2933">验证核心 ROI 假设</text>
    </g>
