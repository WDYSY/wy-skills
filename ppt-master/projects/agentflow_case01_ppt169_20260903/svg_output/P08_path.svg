    <g transform="translate(12, 260)">
      <circle cx="8" cy="8" r="4" fill="#2E8B57"/>
      <text x="20" y="14" font-family="Microsoft YaHei, Arial, sans-serif" font-size="16" fill="#1F2933">ROI 数据可量化呈现</text>
