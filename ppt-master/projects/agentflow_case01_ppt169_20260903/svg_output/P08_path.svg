      <text x="20" y="14" font-family="Microsoft YaHei, Arial, sans-serif" font-size="16" fill="#1F2933">新客户部署周期缩短</text>
    </g>
    <g transform="translate(12, 260)">
      <circle cx="8" cy="8" r="4" fill="#17324D"/>
      <text x="20" y="14" font-family="Microsoft YaHei, Arial, sans-serif" font-size="16" fill="#1F2933">行业解决方案打包</text>
    </g>
    <g transform="translate(12, 292)">
      <circle cx="8" cy="8" r="4" fill="#17324D"/>
      <text x="20" y="14" font-family="Microsoft YaHei, Arial, sans-serif" font-size="16" fill="#1F2933">→ 调度量计费引入</text>
