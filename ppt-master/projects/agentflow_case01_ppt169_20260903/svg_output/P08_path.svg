    <rect x="12" y="320" width="216" height="28" rx="6" fill="#1F6FB2" opacity="0.1"/>
    <text x="120" y="340" font-family="Microsoft YaHei, Arial, sans-serif" font-size="16" fill="#1F6FB2" text-anchor="middle">实施服务费</text>
    <text x="120" y="356" font-family="Microsoft YaHei, Arial, sans-serif" font-size="14" fill="#5B6773" text-anchor="middle">周期：4-8 周</text>
